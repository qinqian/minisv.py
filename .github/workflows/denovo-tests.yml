name: De novo tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest==8.3.5
      - run: python -m pytest tests/test_trgt_hypotheses.py tests/test_trio_*.py -q --ignore=tests/test_trio_pipeline.py --ignore=tests/test_trio_prepare_io.py
